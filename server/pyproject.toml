[project]
name = "api-test-pilot"
version = "0.1.0"
description = "MCP server for OpenAPI spec-driven API testing"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.0,<3",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "jsonschema>=4.21",
    "rfc3339-validator>=0.1.4",
    "rfc3986-validator>=0.1.1",
]

[project.scripts]
api-test-pilot-mcp = "api_test_pilot.server:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api_test_pilot"]

[tool.pytest.ini_options]
testpaths = ["../tests"]
pythonpath = ["../scripts"]
